<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="58%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#52B788" />
    </linearGradient>
    <radialGradient id="frogBody" cx="42%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Lily pad at bottom -->
  <ellipse cx="256" cy="408" rx="168" ry="38" fill="#2D6A4F" />
  <ellipse cx="256" cy="400" rx="154" ry="30" fill="#52B788" />
  <!-- Back leg -->
  <ellipse cx="145" cy="316" rx="46" ry="30" transform="rotate(-18 145 316)" fill="#EAB308" stroke="#422006" stroke-width="14" />
  <!-- Plump yellow body -->
  <ellipse cx="256" cy="282" rx="134" ry="104" fill="url(#frogBody)" stroke="#422006" stroke-width="16" />
  <!-- Cream belly -->
  <ellipse cx="272" cy="322" rx="88" ry="48" fill="#FEF9C3" />
  <!-- Spots -->
  <ellipse cx="192" cy="242" rx="22" ry="14" transform="rotate(-22 192 242)" fill="#CA8A04" opacity="0.45" />
  <ellipse cx="230" cy="218" rx="16" ry="11" transform="rotate(-12 230 218)" fill="#CA8A04" opacity="0.45" />
  <!-- Eyes bumps -->
  <circle cx="322" cy="184" r="52" fill="#FACC15" stroke="#422006" stroke-width="15" />
  <circle cx="242" cy="176" r="58" fill="#FDE047" stroke="#422006" stroke-width="15" />
  <!-- Eye whites -->
  <circle cx="326" cy="184" r="35" fill="#FFFFFF" />
  <circle cx="246" cy="176" r="40" fill="#FFFFFF" />
  <!-- Pupils -->
  <circle cx="337" cy="184" r="18" fill="#1C1917" />
  <circle cx="258" cy="176" r="21" fill="#1C1917" />
  <!-- Catchlights -->
  <circle cx="343" cy="175" r="7" fill="#FFFFFF" />
  <circle cx="266" cy="166" r="8" fill="#FFFFFF" />
  <!-- Cheek blush -->
  <ellipse cx="314" cy="284" rx="26" ry="15" fill="#FB7185" opacity="0.58" />
  <!-- Big happy frog smile -->
  <path d="M 304 274 Q 344 298 374 268" fill="none" stroke="#422006" stroke-width="14" stroke-linecap="round" />
</svg>
